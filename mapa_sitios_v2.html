<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sitios de Transporte — Mineral de la Reforma</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--border:#30363d;--accent:#f97316;--accent2:#fb923c;--text:#e6edf3;--text2:#8b949e;--text3:#6e7681;--green:#3fb950;--blue:#58a6ff;--purple:#bc8cff;--red:#f85149;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:1000;}
.header-left{display:flex;align-items:center;gap:14px;}
.logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.header-title{font-size:15px;font-weight:600;letter-spacing:-0.3px;}
.header-sub{font-size:11px;color:var(--text2);font-weight:400;}
.header-stats{display:flex;gap:20px;}
.stat-item{text-align:right;}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:500;color:var(--accent);}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;}
.main{display:flex;flex:1;overflow:hidden;}
.sidebar{width:360px;min-width:360px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;transition:all .15s;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(249,115,22,.05);}
.tab:hover{color:var(--text);background:var(--panel2);}
.search-box{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.search-input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:7px 12px;color:var(--text);font-family:inherit;font-size:12px;outline:none;transition:border-color .15s;}
.search-input:focus{border-color:var(--accent);}
.search-input::placeholder{color:var(--text3);}
.panel-content{flex:1;overflow-y:auto;}
.panel-content::-webkit-scrollbar{width:4px;}
.panel-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.sitio-card{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;display:flex;gap:10px;align-items:flex-start;}
.sitio-card:hover{background:var(--panel2);}
.sitio-card.active{background:rgba(249,115,22,.08);border-left:3px solid var(--accent);}
.sitio-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.sitio-info{flex:1;min-width:0;}
.sitio-nemo{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:var(--accent);text-transform:uppercase;letter-spacing:1px;}
.sitio-name{font-size:12px;font-weight:500;margin:2px 0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sitio-tipo{font-size:10px;color:var(--text3);}
.sitio-units{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;}
.units-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;line-height:1;}
.units-label{font-size:9px;color:var(--text3);text-transform:uppercase;margin-top:2px;}
.units-bar{width:40px;height:3px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden;}
.units-bar-fill{height:100%;border-radius:2px;}
.conc-card{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
.conc-card:hover,.conc-card.expanded{background:var(--panel2);}
.conc-header{display:flex;align-items:center;gap:8px;}
.conc-rank{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);width:22px;flex-shrink:0;text-align:right;}
.conc-name{font-size:12px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conc-count{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--accent);flex-shrink:0;min-width:24px;text-align:right;}
.conc-details{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:none;}
.conc-card.expanded .conc-details{display:block;}
.detail-row{display:flex;gap:6px;margin-bottom:5px;flex-wrap:wrap;}
.detail-tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;font-family:'JetBrains Mono',monospace;}
.tag-nemo{background:rgba(249,115,22,.15);color:var(--accent);}
.tag-marca{background:rgba(88,166,255,.12);color:var(--blue);}
.detail-label{font-size:10px;color:var(--text3);margin:6px 0 3px;text-transform:uppercase;letter-spacing:0.5px;}
.operador-item{font-size:11px;color:var(--text2);padding:2px 0;border-bottom:1px solid rgba(48,54,61,.4);}
.operador-item:last-child{border-bottom:none;}
.empty-results{padding:30px;text-align:center;color:var(--text3);font-size:13px;}
#map{width:100%;height:100%;}
.info-panel{position:absolute;right:12px;top:12px;width:320px;background:var(--panel);border:1px solid var(--border);border-radius:10px;z-index:1000;overflow:hidden;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.info-panel.visible{display:block;}
.info-header{padding:12px 14px;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.info-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0;line-height:1;}
.info-close:hover{color:var(--text);}
.info-body{padding:12px 14px;max-height:460px;overflow-y:auto;}
.info-body::-webkit-scrollbar{width:3px;}
.info-body::-webkit-scrollbar-thumb{background:var(--border);}
.info-big-num{font-family:'JetBrains Mono',monospace;font-size:36px;font-weight:700;color:var(--accent);line-height:1;margin-bottom:4px;}
.info-section-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin:12px 0 6px;}
.unit-row{display:grid;grid-template-columns:50px 1fr 65px 38px;gap:4px;padding:5px 0;border-bottom:1px solid rgba(48,54,61,.5);font-size:10px;}
.unit-row:last-child{border-bottom:none;}
.eco{font-family:'JetBrains Mono',monospace;color:var(--accent2);}
.propietario{color:var(--text);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.marca{color:var(--blue);}
.anio{color:var(--text3);text-align:right;}
.map-legend{position:absolute;bottom:24px;left:12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;z-index:1000;font-size:11px;min-width:140px;}
.legend-title{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:8px;}
.legend-item{display:flex;align-items:center;gap:7px;margin-bottom:5px;color:var(--text2);}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.leaflet-container{background:#1a1f2b !important;}
.leaflet-tile{filter:brightness(.65) saturate(.5) hue-rotate(185deg);}
.leaflet-popup-content-wrapper{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:8px;}
.leaflet-popup-tip{background:var(--panel);}
.leaflet-popup-content{margin:0;}
.leaflet-control-zoom{border:1px solid var(--border) !important;border-radius:6px !important;overflow:hidden;}
.leaflet-control-zoom a{background:var(--panel) !important;color:var(--text) !important;border:none !important;}
.leaflet-control-zoom a:hover{background:var(--panel2) !important;}
.leaflet-attribution-flag{display:none;}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="logo">🚌</div>
    <div>
      <div class="header-title">Sitios &amp; Bases de Transporte</div>
      <div class="header-sub">Mineral de la Reforma · Hidalgo · Cruce por Nemotécnica</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat-item"><div class="stat-num" id="totalSitios">—</div><div class="stat-label">Sitios</div></div>
    <div class="stat-item"><div class="stat-num" id="totalUnidades">—</div><div class="stat-label">Unidades</div></div>
    <div class="stat-item"><div class="stat-num" id="totalConc">—</div><div class="stat-label">Concesionarios</div></div>
  </div>
</header>
<div class="main">
  <div class="sidebar">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('sitios')">📍 Sitios</div>
      <div class="tab" onclick="switchTab('conc')">👤 Concesionarios</div>
    </div>
    <div class="search-box">
      <input class="search-input" id="searchInput" type="text" placeholder="Buscar…" oninput="handleSearch()">
    </div>
    <div class="panel-content" id="panelContent"></div>
  </div>
  <div style="position:relative;flex:1;display:flex;">
    <div id="map"></div>
    <div class="info-panel" id="infoPanel">
      <div class="info-header">
        <div>
          <div style="font-family:monospace;font-size:10px;color:var(--accent);letter-spacing:1px" id="iNemo"></div>
          <div style="font-size:13px;font-weight:600;margin-top:3px" id="iName"></div>
          <div style="font-size:10px;color:var(--text3);margin-top:2px" id="iTipo"></div>
        </div>
        <button class="info-close" onclick="closeInfo()">✕</button>
      </div>
      <div class="info-body">
        <div class="info-big-num" id="iBig"></div>
        <div style="font-size:11px;color:var(--text3)">unidades registradas</div>
        <div class="info-section-title">Unidades asignadas</div>
        <div id="iUnits"></div>
      </div>
    </div>
    <div class="map-legend">
      <div class="legend-title">Tipo de sitio</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>Base</div>
      <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Paradero</div>
      <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Patio</div>
      <div class="legend-item"><div class="legend-dot" style="background:#bc8cff"></div>Sitio</div>
      <div class="legend-item"><div class="legend-dot" style="background:#8b949e"></div>Otro</div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);color:var(--text3);font-size:10px">Tamaño = # unidades</div>
    </div>
  </div>
</div>

  const color = TIPO_COLORS[sitio.TIPO]||'#8b949e';
  const circle = L.circleMarker([sitio.LAT,sitio.LON],{
    radius:mRadius(sitio.total_unidades),
    fillColor:color,fillOpacity:.85,color:'#fff',weight:1.5,opacity:.9
  }).addTo(map);

  if(sitio.CLAVE_NEMOTECNICA){
    const icon = L.divIcon({
      html:`<span style="font-family:monospace;font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:3px;white-space:nowrap">${sitio.CLAVE_NEMOTECNICA}</span>`,
      className:'',iconAnchor:[0,0]
    });
    L.marker([sitio.LAT+0.0012,sitio.LON],{icon}).addTo(map);
  }

  circle.on('click',()=>openInfo(sitio));
  circle.on('mouseover',function(){this.setStyle({weight:3});});
  circle.on('mouseout',function(){this.setStyle({weight:1.5});});
  markers[sitio.ID]={circle,sitio};
});

function openInfo(sitio){
  document.getElementById('iNemo').textContent  = sitio.CLAVE_NEMOTECNICA||'—';
  document.getElementById('iName').textContent  = sitio.NOMBRE;
  document.getElementById('iTipo').textContent  = sitio.TIPO||'';
  document.getElementById('iBig').textContent   = sitio.total_unidades;
  const units = APP_DATA.unidades_by_nemo[sitio.CLAVE_NEMOTECNICA]||[];
  const el = document.getElementById('iUnits');
  el.innerHTML = units.length===0
    ? '<div style="color:var(--text3);font-size:11px">Sin unidades registradas</div>'
    : `<div style="display:grid;grid-template-columns:50px 1fr 65px 38px;gap:4px;padding:4px 0;border-bottom:1px solid var(--border);font-size:9px;color:var(--text3);text-transform:uppercase">
         <span>Eco</span><span>Propietario</span><span>Marca</span><span>Año</span>
       </div>`
    + units.map(u=>`<div class="unit-row">
         <span class="eco">${u.num_eco}</span>
         <span class="propietario" title="${u.propietario}">${u.propietario}</span>
         <span class="marca">${u.marca}</span>
         <span class="anio">${u.anio}</span>
       </div>`).join('');
  document.getElementById('infoPanel').classList.add('visible');
  document.querySelectorAll('.sitio-card').forEach(c=>c.classList.remove('active'));
  const card=document.querySelector(`[data-id="${sitio.ID}"]`);
  if(card){card.classList.add('active');card.scrollIntoView({behavior:'smooth',block:'nearest'});}
}
function closeInfo(){
  document.getElementById('infoPanel').classList.remove('visible');
  document.querySelectorAll('.sitio-card').forEach(c=>c.classList.remove('active'));
}

let tab='sitios', q='';
function switchTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',(i===0&&t==='sitios')||(i===1&&t==='conc')));
  document.getElementById('searchInput').value=''; q=''; render();
}
function handleSearch(){q=document.getElementById('searchInput').value.toLowerCase();render();}

function render(){tab==='sitios'?renderSitios():renderConcs();}

function renderSitios(){
  const el=document.getElementById('panelContent');
  let list=APP_DATA.sitios.filter(s=>!q||(s.NOMBRE||'').toLowerCase().includes(q)||(s.CLAVE_NEMOTECNICA||'').toLowerCase().includes(q)||(s.TIPO||'').toLowerCase().includes(q));
  if(!list.length){el.innerHTML='<div class="empty-results">Sin resultados</div>';return;}
  list=[...list].sort((a,b)=>b.total_unidades-a.total_unidades);
  el.innerHTML=list.map(s=>{
    const col=TIPO_COLORS[s.TIPO]||'#8b949e';
    const em=TIPO_EMOJI[s.TIPO]||'📌';
    const pct=MAX_U>0?(s.total_unidades/MAX_U)*100:0;
    const uc=s.total_unidades>100?'#f85149':s.total_unidades>20?'#f97316':'#3fb950';
    return `<div class="sitio-card" data-id="${s.ID}" onclick="flyTo(${s.ID})">
      <div class="sitio-icon" style="background:${col}22;border:1px solid ${col}44">${em}</div>
      <div class="sitio-info">
        <div class="sitio-nemo">${s.CLAVE_NEMOTECNICA||'SIN CLAVE'}</div>
        <div class="sitio-name" title="${s.NOMBRE}">${s.NOMBRE}</div>
        <div class="sitio-tipo">${s.TIPO||''}</div>
      </div>
      <div class="sitio-units">
        <div class="units-num" style="color:${uc}">${s.total_unidades}</div>
        <div class="units-label">unidades</div>
        <div class="units-bar"><div class="units-bar-fill" style="width:${pct}%;background:${uc}"></div></div>
      </div>
    </div>`;
  }).join('');
}

function renderConcs(){
  const el=document.getElementById('panelContent');
  let list=APP_DATA.concesionarios;
  if(q) list=list.filter(c=>(c.PROPIETARIO||'').toLowerCase().includes(q)||(c.nemotecnicas||[]).some(n=>n.toLowerCase().includes(q))||(c.operadores||[]).some(o=>o.toLowerCase().includes(q)));
  if(!list.length){el.innerHTML='<div class="empty-results">Sin resultados</div>';return;}
  el.innerHTML=list.map((c,i)=>{
    const nTags=(c.nemotecnicas||[]).map(n=>`<span class="detail-tag tag-nemo">${n}</span>`).join('');
    const mTags=(c.marcas||[]).filter(m=>m&&m!=='-'&&m!=='NO APLICA').slice(0,4).map(m=>`<span class="detail-tag tag-marca">${m}</span>`).join('');
    const ops=(c.operadores||[]).filter(o=>o&&o!=='-'&&o!=='NO APLICA'&&o!=='SIN DATOS');
    return `<div class="conc-card" id="cc${i}" onclick="toggleC(${i})">
      <div class="conc-header">
        <span class="conc-rank">#${i+1}</span>
        <span class="conc-name" title="${c.PROPIETARIO}">${c.PROPIETARIO}</span>
        <span class="conc-count">${c.total_unidades}</span>
      </div>
      <div class="conc-details">
        ${nTags?`<div class="detail-label">Rutas</div><div class="detail-row">${nTags}</div>`:''}
        ${mTags?`<div class="detail-label">Marcas</div><div class="detail-row">${mTags}</div>`:''}
        ${ops.length?`<div class="detail-label">Operadores (${ops.length})</div>${ops.map(o=>`<div class="operador-item">👤 ${o}</div>`).join('')}`:''}
      </div>
    </div>`;
  }).join('');
}

function toggleC(i){document.getElementById('cc'+i).classList.toggle('expanded');}
function flyTo(id){const{sitio}=markers[id];map.flyTo([sitio.LAT,sitio.LON],16,{duration:.8});openInfo(sitio);}

render();
document.getElementById('totalSitios').textContent  = APP_DATA.sitios.length;
document.getElementById('totalUnidades').textContent = APP_DATA.sitios.reduce((s,x)=>s+x.total_unidades,0);
document.getElementById('totalConc').textContent     = APP_DATA.concesionarios.length;

</script>
</body>
</html>
